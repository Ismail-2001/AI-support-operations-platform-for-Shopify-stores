# render.yaml - Render Blueprint
# Deploy to Render.com (Free Tier: 750 hours/month)
#
# Setup:
# 1. Push agent to GitHub
# 2. Go to render.com > New > Blueprint
# 3. Connect your GitHub repo
# 4. Render auto-detects this file

services:
  - type: web
    name: cs-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    # ── Persistent disk (PAYING CLIENTS ONLY) ─────────────────────────
    # The free plan has NO disk: SQLite lives in the working directory and
    # is wiped on every deploy/restart (fine for demos, NOT for real data).
    # To persist data:
    #   1. Change `plan: free` above to `plan: starter` (disks need Starter+)
    #   2. Uncomment the disk block below
    #   3. Set DB_PATH=/var/data/cs_agent.db (see Storage section)
    # Verify with GET /health -> checks.storage == "persistent"
    # disk:
    #   name: cs-agent-data
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      # ── Tenant ──────────────────────────────────────────
      - key: TENANT_NAME
        sync: false

      # ── LLM (primary: OpenRouter > Groq > Gemini; fallback: Claude) ──
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FALLBACK_MODEL
        value: claude-haiku-4-5-20251001
      - key: GOOGLE_API_KEY
        sync: false

      # ── Shopify ─────────────────────────────────────────
      - key: SHOPIFY_SHOP_DOMAIN
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false

      # ── Gorgias ─────────────────────────────────────────
      - key: GORGIAS_DOMAIN
        sync: false
      - key: GORGIAS_EMAIL
        sync: false
      - key: GORGIAS_API_KEY
        sync: false
      - key: GORGIAS_WEBHOOK_SECRET
        sync: false

      # ── Automation policy ───────────────────────────────
      - key: AUTO_SEND_ENABLED
        value: "false"
      - key: AUTO_SEND_MIN_CONFIDENCE
        value: "0.85"
      - key: AUTO_SEND_BLOCKED_CATEGORIES
        value: "refund,complaint,legal,other"

      # ── Storage ─────────────────────────────────────────
      # SQLite file. Relative path = service working directory (EPHEMERAL on
      # Render free plan — wiped every deploy; OK for demos only).
      # Paying clients: attach a disk (block above) and set:
      #   DB_PATH=/var/data/cs_agent.db
      # Absolute paths are used verbatim (no tenant prefix); the default
      # relative path gets auto-prefixed with TENANT_NAME.
      - key: DB_PATH
        value: cs_agent.db
      - key: ENV
        value: production

      # ── API Security ────────────────────────────────────
      - key: API_KEY
        sync: false
      - key: REQUIRE_API_KEY
        value: "true"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: REFUND_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: RESEND_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: INBOUND_WEBHOOK_SECRET
        sync: false

      # ── Cost governance ───────────────────────────────────
      - key: DAILY_COST_CAP_USD
        value: "5.0"

      # ── Python runtime (Render only, not in .env.example) ──
      - key: PYTHON_VERSION
        value: "3.12.0"
